services:
  - type: web
    name: paytrack-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build -w @paytrack/server
    startCommand: npm run start -w @paytrack/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"

databases:
  - name: paytrack-db
    databaseName: paytrack
    user: paytrack
    plan: free
    region: singapore
