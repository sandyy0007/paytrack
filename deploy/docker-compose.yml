services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paytrack}
      POSTGRES_USER: ${POSTGRES_USER:-paytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_db_password_in_env}
    volumes:
      - paytrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paytrack} -d ${POSTGRES_DB:-paytrack}"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - paytrack-network

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-paytrack}:${POSTGRES_PASSWORD:-change_this_db_password_in_env}@db:5432/${POSTGRES_DB:-paytrack}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_random_string_at_least_32_chars}
      TRUST_PROXY: "1"
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - paytrack-network

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - paytrack-network

volumes:
  paytrack_pgdata:
  caddy_data:
  caddy_config:

networks:
  paytrack-network:
    driver: bridge
