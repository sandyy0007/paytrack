# Local backend: `docker compose up --build` → API on http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paytrack
      POSTGRES_PASSWORD: paytrack
      POSTGRES_DB: paytrack
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrack"]
      interval: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      DATABASE_URL: postgres://paytrack:paytrack@db:5432/paytrack
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-please-change-0123456789abcdef}
      NODE_ENV: production
      TRUST_PROXY: "0"
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
